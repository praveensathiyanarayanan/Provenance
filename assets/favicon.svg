<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Imperial Gold Gradient -->
    <linearGradient id="pGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2d6" />
      <stop offset="35%" stop-color="#dfbe76" />
      <stop offset="70%" stop-color="#b88939" />
      <stop offset="100%" stop-color="#f0d599" />
    </linearGradient>
    <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfbe76" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#554425" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#b88939" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1c222b" />
      <stop offset="65%" stop-color="#0c0e12" />
      <stop offset="100%" stop-color="#06080a" />
    </radialGradient>
  </defs>

  <!-- Obsidian Base Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGlow)" stroke="url(#pBorder)" stroke-width="1.5" />
  
  <!-- Subtle Architectural Inner Inset -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="12" fill="none" stroke="#dfbe76" stroke-opacity="0.18" stroke-width="0.75" />
  
  <!-- Architectural Diamond Motif -->
  <path d="M 32 8.5 L 53.5 32 L 32 55.5 L 10.5 32 Z" fill="none" stroke="url(#pGold)" stroke-opacity="0.22" stroke-width="0.8" stroke-dasharray="1.5 1.5" />

  <!-- Monogram 'P' Classical Typography & Architectural Sanctuary Crown -->
  <g fill="url(#pGold)">
    <!-- Serif Base Foot -->
    <path d="M 21 44.5 C 22.5 44.5 24 44.5 25 44.2 L 25 43 L 26.5 43 L 26.5 21 L 25 21 L 25 19.8 C 24 19.5 22.5 19.5 21 19.5 L 21 18 L 36.5 18 C 42.5 18 46.5 21.2 46.5 26.2 C 46.5 31.5 42 34.5 35.5 34.5 L 29.5 34.5 L 29.5 43 L 31 43 L 31 44.2 C 30 44.5 28.5 44.5 27 44.5 L 21 44.5 Z M 29.5 32.2 L 35 32.2 C 39.5 32.2 42.8 30.2 42.8 26.2 C 42.8 22.2 39.5 20.3 35 20.3 L 29.5 20.3 L 29.5 32.2 Z" />
    
    <!-- Four-Point Architectural Keystone / Star at Upper Apex -->
    <path d="M 44.5 14.5 C 44.5 15.8 45.2 16.5 46.5 16.5 C 45.2 16.5 44.5 17.2 44.5 18.5 C 44.5 17.2 43.8 16.5 42.5 16.5 C 43.8 16.5 44.5 15.8 44.5 14.5 Z" opacity="0.9" />
  </g>
</svg>
